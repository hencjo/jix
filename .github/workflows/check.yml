name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: cachix/install-nix-action@v31
      - run: nix develop --command python3 -B scripts/check-secrets
      - run: nix develop --command python3 -B tools/test_secrets.py
      - run: nix develop --command python3 -B tools/test_release.py
      - run: nix flake check --print-build-logs
      - run: python3 -B tools/test_explicit.py
      - run: python3 -B tools/test_generated_sources.py
      - run: python3 -B tools/test_matrix.py
      - run: nix develop --command cargo test -p jix --locked --test lock_codec -- --ignored
      - run: python3 -B tools/test_resolution_context.py
      - run: python3 -B tools/test_nix.py
      - run: python3 -B tools/test_project.py
      - run: python3 -B tools/test_composition.py
